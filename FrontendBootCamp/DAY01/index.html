<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0%;
            margin: 0%;
        }

        html {
            font-size: 16px;
        }


        header {
            width: 100%;
            background-color: darkgrey;
            margin: 0px;
            padding: 20px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .menu-items {
            display: flex;
            align-items: center;
            justify-content: end;
        }

        .menu-items li {
            margin-left: 10px;
            list-style: none;
        }

        .menu-items li a {
            text-decoration: none;
            color: #000;
        }

        .menu-items li:last-child {
            color: tomato;
        }

        main {
            display: flex;
        }

        main div {
            width: 80%;
            background-color: darkcyan;
        }

        main .dot {
            background-color: blue;
            margin-left: 70%;
            width: 50px;
            height: 50px;
            position: fixed;

        }

        aside {
            background-color: aquamarine !important;
            width: 20%;

        }

        aside {
            height: 100vh;
        }

        aside .bot {

            margin-top: 80%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            padding: 5%;
            ;
            position: fixed;
        }

        footer {
            background-color: turquoise;
            height: 100%;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="" alt="logo">
            </div>
            <div class="menu-items">



                <li><a href="">HOME</a></li>
                <li><a href="">Lorem, ipsum.</a></li>
                <li><a href="">Lorem.</a></li>

            </div>

        </nav>
    </header>
    <main>

        <div class="container">
            <div class="card"></div>
        </div>

        <div class="dot">. </div>

        <aside style=>aside

            <div class="bot">Bot</div>
        </aside>
    </main>

    <footer>footer</footer>

</body>

</html>
