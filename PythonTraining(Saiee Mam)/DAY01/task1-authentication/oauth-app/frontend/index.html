<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OAuth Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-google { background: #4285F4; color: white; }
    .btn-logout { background: #e74c3c; color: white; margin-top: 1rem; }
    .profile { display: none; }
    .profile img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .profile h2 { font-size: 1.2rem; }
    .profile span { color: #666; font-size: 0.85rem; }
    #login-section, #profile-section { }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-section">
      <h1>Welcome</h1>
      <p>Sign in to continue</p>
      <a class="btn btn-google" href="http://localhost:8000/auth/login">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.5 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/>
        </svg>
        Sign in with Google
      </a>
    </div>

    <div id="profile-section" class="profile">
      <img id="user-pic" src="" alt="Profile picture" />
      <h2 id="user-name"></h2>
      <span id="user-email"></span>
      <br/>
      <button class="btn btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";

    // Check for token in URL (after OAuth callback redirect)
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    if (token) {
      localStorage.setItem("jwt", token);
      window.history.replaceState({}, "", "/"); // clean URL
    }

    async function loadUser() {
      const jwt = localStorage.getItem("jwt");
      if (!jwt) return;

      const res = await fetch(`${API}/auth/me`, {
        headers: { Authorization: `Bearer ${jwt}` },
      });

      if (!res.ok) {
        localStorage.removeItem("jwt");
        return;
      }

      const user = await res.json();
      document.getElementById("login-section").style.display = "none";
      document.getElementById("profile-section").style.display = "block";
      document.getElementById("user-pic").src = user.picture;
      document.getElementById("user-name").textContent = user.name;
      document.getElementById("user-email").textContent = user.email;
    }

    function logout() {
      localStorage.removeItem("jwt");
      document.getElementById("login-section").style.display = "block";
      document.getElementById("profile-section").style.display = "none";
    }

    loadUser();
  </script>
</body>
</html>
